name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag (e.g. v1.0.0) to publish a downloadable GitHub Release"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Swara Studio APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare signing keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 --decode debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build Debug & Release APKs
        run: gradle assembleDebug assembleRelease --no-daemon --console=plain

      - name: Package APKs for download
        run: |
          mkdir -p dist-apk
          cp app/build/outputs/apk/debug/app-debug.apk dist-apk/SwaraStudio-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist-apk/SwaraStudio-release.apk
          fi
          ls -lh dist-apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SwaraStudio-APK
          path: dist-apk/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release on tag or manual release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          name: Swara Studio ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          files: |
            dist-apk/SwaraStudio-release.apk
            dist-apk/SwaraStudio-debug.apk
          generate_release_notes: true
